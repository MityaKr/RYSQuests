plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

group = mod_group
version = mod_version

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

// In-game autotest: part of the mod only in dev runs, never packaged into the jar.
sourceSets {
    autotest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.autotest
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'rysquests.dev.examplePack', project.file('examples/example_pack').absolutePath
        }
        autotest {
            client()
            gameDirectory = project.file('run')
            systemProperty 'rysquests.dev.examplePack', project.file('examples/example_pack').absolutePath
            systemProperty 'rysquests.dev.brokenPack', project.file('examples/broken').absolutePath
            systemProperty 'rysquests.autotest', project.findProperty('autotest') ?: 'datapack'
            programArguments.addAll '--width', '1280', '--height', '720'
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

neoForge.addModdingDependenciesTo(sourceSets.autotest)

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
    systemProperty 'rysquests.examplesDir', project.file('examples').absolutePath
}

tasks.named('check') {
    dependsOn 'autotestClasses'
}

// The game exits normally even when a scenario fails, so the verdict is read from its log.
def autotestLog = file('run/logs/latest.log')
tasks.matching { it.name == 'runAutotest' }.configureEach {
    doLast {
        def lines = autotestLog.readLines('UTF-8')
        def errors = lines.findAll { it =~ /\/(ERROR|FATAL)\]/ }
        if (!errors.isEmpty()) {
            throw new GradleException("Autotest log has ${errors.size()} error line(s), first: ${errors[0]}")
        }
        if (!lines.any { it.contains('[autotest] PASS') }) {
            throw new GradleException('Autotest finished without a PASS line, see run/logs/latest.log')
        }
    }
}

processResources {
    def props = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_license: mod_license,
        minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
